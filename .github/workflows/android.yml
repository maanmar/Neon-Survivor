                      c.drawRect(p.x - rad * 0.45f, p.y - rad * 0.15f, p.x + rad * 0.45f, p.y + rad * 0.45f, fillPaint);
                  } else {
                      fillPaint.setColor(Color.rgb(45, 215, 255));
                      c.drawCircle(p.x, p.y, rad * 1.15f, fillPaint);
                      strokePaint.setColor(Color.WHITE);
                      strokePaint.setStrokeWidth(5f);
                      c.drawCircle(p.x, p.y, rad * 0.72f, strokePaint);
                  }
              }


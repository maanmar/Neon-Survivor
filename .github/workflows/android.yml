                  c.drawText("" + score, pad + 24f, topY + height * 0.042f, textPaint);

                  textPaint.setTextSize(width * 0.033f);
                  textPaint.setColor(Color.rgb(255, 215, 70));
                  c.drawText("₹ " + runCoins + "   " + (int) distance + "m", pad + 24f, topY + height * 0.078f, textPaint);

                  // Hearts
                  for (int i = 0; i < maxHp; i++) {
                      fillPaint.setColor(i < hp ? Color.rgb(255, 65, 85) : Color.rgb(75, 75, 85));
                      c.drawCircle(pad + 22f + i * (width * 0.052f), topY + height * 0.118f, width * 0.019f, fillPaint);
                  }

                  // Nitro bar
                  float barX = pad;
                  float barY = topY + height * 0.145f;
                  float barW = width * 0.42f;
                  float barH = height * 0.016f;
                  fillPaint.setColor(Color.argb(180, 20, 22, 30));
                  c.drawRoundRect(barX, barY, barX + barW, barY + barH, 10f, 10f, fillPaint);
                  fillPaint.setColor(nitroActive ? Color.rgb(255, 90, 20) : Color.rgb(255, 185, 40));
                  c.drawRoundRect(barX, barY, barX + barW * (nitro / 100f), barY + barH, 10f, 10f, fillPaint);

                  // Pause & Mute buttons
                  drawRoundBtn(c, btnPause, state == STATE_PAUSED ? "▶" : "II", Color.argb(190, 20, 24, 34), Color.WHITE);
                  drawRoundBtn(c, btnMute, sound.isMuted() ? "🔇" : "🔊", Color.argb(190, 20, 24, 34), Color.WHITE);

                  // Bottom touch buttons: HORN and CHAI NITRO
                  int hornBg = (hornCooldown <= 0f) ? Color.argb(225, 245, 195, 30) : Color.argb(140, 80, 80, 90);
                  String hornLbl = (hornCooldown <= 0f) ? "HORN" : String.format(java.util.Locale.US, "%.1fs", hornCooldown);
                  drawRoundBtn(c, btnHorn, hornLbl, hornBg, Color.rgb(20, 20, 24));

                  int nitroBg = nitroActive ? Color.argb(240, 255, 85, 25) : (nitro >= 30f ? Color.argb(225, 255, 135, 30) : Color.argb(140, 80, 80, 90));
                  drawRoundBtn(c, btnNitro, nitroActive ? "BOOST!" : "CHAI NITRO", nitroBg, Color.WHITE);
              }

              private void drawRoundBtn(Canvas c, RectF r, String label, int bg, int fg) {
                  fillPaint.setColor(bg);
                  c.drawRoundRect(r, 24f, 24f, fillPaint);
                  strokePaint.setColor(Color.rgb(18, 18, 22));
                  strokePaint.setStrokeWidth(4f);
                  c.drawRoundRect(r, 24f, 24f, strokePaint);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(Math.min(r.height() * 0.36f, width * 0.044f));
                  textPaint.setColor(fg);
                  c.drawText(label, r.centerX(), r.centerY() + textPaint.getTextSize() * 0.35f, textPaint);
              }

              private void drawMenu(Canvas c) {
                  fillPaint.setColor(Color.argb(175, 10, 12, 22));
                  c.drawRect(0, 0, width, height, fillPaint);

                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(width * 0.115f);
                  textPaint.setColor(Color.rgb(255, 195, 35));
                  c.drawText("DESI TURBO", width * 0.5f, height * 0.17f, textPaint);

                  textPaint.setTextSize(width * 0.068f);
                  textPaint.setColor(Color.rgb(95, 235, 155));
                  c.drawText("GT ROAD RUSH", width * 0.5f, height * 0.225f, textPaint);

                  textPaint.setTextSize(width * 0.038f);
                  textPaint.setColor(Color.rgb(230, 235, 245));
                  c.drawText("BEST: " + bestScore + "   •   BANK: ₹" + totalCoins, width * 0.5f, height * 0.28f, textPaint);

                  // Animated showcase of selected ride
                  float bob = (float) Math.sin(menuPulse) * 10f;
                  drawPlayer(c, width * 0.5f, height * 0.39f + bob, laneWidth * 0.85f, laneWidth * 1.45f, 0f, selectedRide);

                  textPaint.setTextSize(width * 0.036f);
                  textPaint.setColor(Color.rgb(255, 220, 110));
                  c.drawText("CHOOSE YOUR RIDE", width * 0.5f, height * 0.485f, textPaint);

                  drawRideCard(c, btnRide0, "AUTO", "Balanced", RIDE_AUTO);
                  drawRideCard(c, btnRide1, "TRACTOR", "Smash Wood", RIDE_TRACTOR);
                  drawRideCard(c, btnRide2, "BULLET", "Fast 2x ₹", RIDE_BULLET);

                  drawRoundBtn(c, btnPlay, "PLAY NOW", Color.rgb(35, 195, 95), Color.WHITE);

                  textPaint.setTextSize(width * 0.033f);
                  textPaint.setColor(Color.rgb(195, 205, 220));
                  c.drawText("Swipe or tap left/right to steer • Use Horn & Chai Nitro!", width * 0.5f, height * 0.87f, textPaint);
              }

              private void drawRideCard(Canvas c, RectF r, String name, String perk, int rideId) {
                  boolean sel = (selectedRide == rideId);
                  fillPaint.setColor(sel ? Color.rgb(42, 68, 52) : Color.argb(210, 24, 28, 40));
                  c.drawRoundRect(r, 20f, 20f, fillPaint);
                  strokePaint.setColor(sel ? Color.rgb(255, 205, 45) : Color.rgb(85, 95, 115));
                  strokePaint.setStrokeWidth(sel ? 6f : 3f);
                  c.drawRoundRect(r, 20f, 20f, strokePaint);

                  drawPlayer(c, r.centerX(), r.top + r.height() * 0.38f, r.width() * 0.34f, r.height() * 0.42f, 0f, rideId);

                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(width * 0.036f);
                  textPaint.setColor(Color.WHITE);
                  c.drawText(name, r.centerX(), r.bottom - r.height() * 0.22f, textPaint);

                  textPaint.setTextSize(width * 0.027f);
                  textPaint.setColor(Color.rgb(255, 215, 95));
                  c.drawText(perk, r.centerX(), r.bottom - r.height() * 0.08f, textPaint);
              }

              private void drawPauseOverlay(Canvas c) {
                  fillPaint.setColor(Color.argb(175, 8, 10, 18));
                  c.drawRect(0, 0, width, height, fillPaint);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(width * 0.095f);
                  textPaint.setColor(Color.WHITE);
                  c.drawText("PAUSED", width * 0.5f, height * 0.45f, textPaint);
                  drawRoundBtn(c, btnRestart, "RESUME", Color.rgb(35, 195, 95), Color.WHITE);
                  drawRoundBtn(c, btnMenu, "MAIN MENU", Color.rgb(65, 75, 95), Color.WHITE);
              }

              private void drawGameOver(Canvas c) {
                  fillPaint.setColor(Color.argb(195, 14, 10, 18));
                  c.drawRect(0, 0, width, height, fillPaint);

                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(width * 0.105f);
                  textPaint.setColor(Color.rgb(255, 95, 70));
                  c.drawText("CRASHED!", width * 0.5f, height * 0.28f, textPaint);

                  textPaint.setTextSize(width * 0.056f);
                  textPaint.setColor(Color.WHITE);
                  c.drawText("SCORE: " + score, width * 0.5f, height * 0.37f, textPaint);

                  textPaint.setTextSize(width * 0.044f);
                  textPaint.setColor(Color.rgb(255, 215, 70));
                  c.drawText("BEST: " + bestScore + "   •   COINS: +₹" + runCoins, width * 0.5f, height * 0.435f, textPaint);

                  textPaint.setTextSize(width * 0.038f);
                  textPaint.setColor(Color.rgb(160, 225, 195));
                  c.drawText("DISTANCE: " + (int) distance + "m", width * 0.5f, height * 0.495f, textPaint);

                  drawRoundBtn(c, btnRestart, "PLAY AGAIN", Color.rgb(35, 195, 95), Color.WHITE);
                  drawRoundBtn(c, btnMenu, "CHANGE RIDE", Color.rgb(65, 75, 95), Color.WHITE);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  float x = e.getX();
                  float y = e.getY();
                  int action = e.getActionMasked();

                  if (action == MotionEvent.ACTION_DOWN) {
                      touchStartX = x;
                      touchStartY = y;
                      swipeHandled = false;

                      if (state == STATE_MENU) {
                          if (btnRide0.contains(x, y)) selectRide(RIDE_AUTO);
                          else if (btnRide1.contains(x, y)) selectRide(RIDE_TRACTOR);
                          else if (btnRide2.contains(x, y)) selectRide(RIDE_BULLET);
                          else if (btnPlay.contains(x, y)) startNewRun();
                          return true;
                      }

                      if (state == STATE_PAUSED) {
                          if (btnRestart.contains(x, y) || btnPause.contains(x, y)) state = STATE_PLAYING;
                          else if (btnMenu.contains(x, y)) state = STATE_MENU;
                          return true;
                      }

                      if (state == STATE_GAME_OVER) {
                          if (btnRestart.contains(x, y)) startNewRun();
                          else if (btnMenu.contains(x, y)) state = STATE_MENU;
                          return true;
                      }

                      if (state == STATE_PLAYING) {
                          if (btnPause.contains(x, y)) {
                              state = STATE_PAUSED;
                              swipeHandled = true;
                              return true;
                          }
                          if (btnMute.contains(x, y)) {
                              sound.toggleMute();
                              swipeHandled = true;
                              return true;
                          }
                          if (btnHorn.contains(x, y)) {
                              triggerHorn();
                              swipeHandled = true;
                              return true;
                          }
                          if (btnNitro.contains(x, y)) {
                              triggerNitro();
                              swipeHandled = true;
                              return true;
                          }
                      }
                  } else if (action == MotionEvent.ACTION_MOVE && state == STATE_PLAYING && !swipeHandled) {
                      float dx = x - touchStartX;
                      if (Math.abs(dx) > width * 0.08f) {
                          if (dx > 0 && playerLane < 3) playerLane++;
                          else if (dx < 0 && playerLane > 0) playerLane--;
                          swipeHandled = true;
                          vibrate(15);
                      }
                  } else if (action == MotionEvent.ACTION_UP && state == STATE_PLAYING && !swipeHandled) {
                      if (Math.abs(x - touchStartX) < width * 0.07f && y > height * 0.16f && y < btnHorn.top - 10f) {
                          if (x < width * 0.5f && playerLane > 0) {
                              playerLane--;
                              vibrate(15);
                          } else if (x >= width * 0.5f && playerLane < 3) {
                              playerLane++;
                              vibrate(15);
                          }
                      }
                  }
                  return true;
              }

              private void selectRide(int ride) {
                  selectedRide = ride;
                  prefs.edit().putInt("selected_ride", ride).apply();
                  sound.playCoin();
                  vibrate(20);
              }

              @Override
              public void run() {
                  long prevTime = System.nanoTime();
                  while (running) {
                      if (!surfaceReady) {
                          try { Thread.sleep(16); } catch (InterruptedException ignored) {}
                          continue;
                      }
                      long now = System.nanoTime();
                      float dt = Math.min(0.05f, (now - prevTime) / 1_000_000_000f);
                      prevTime = now;

                      update(dt);

                      Canvas canvas = null;
                      try {
                          canvas = holder.lockCanvas();
                          if (canvas != null) {
                              synchronized (holder) {
                                  drawScene(canvas);
                              }
                          }
                      } finally {
                          if (canvas != null) {
                              holder.unlockCanvasAndPost(canvas);
                          }
                      }
                  }
              }

              public void resume() {
                  running = true;
                  gameThread = new Thread(this);
                  gameThread.start();
              }

              public void pause() {
                  running = false;
                  if (state == STATE_PLAYING) state = STATE_PAUSED;
                  if (gameThread != null) {
                      try { gameThread.join(500); } catch (InterruptedException ignored) {}
                      gameThread = null;
                  }
              }

              public void release() {
                  pause();
                  sound.release();
              }

              @Override
              public void surfaceCreated(SurfaceHolder holder) {
                  surfaceReady = true;
                  computeLayout(getWidth(), getHeight());
              }

              @Override
              public void surfaceChanged(SurfaceHolder holder, int format, int w, int h) {
                  computeLayout(w, h);
              }

              @Override
              public void surfaceDestroyed(SurfaceHolder holder) {
                  surfaceReady = false;
              }
          }

              private void drawScene(Canvas c) {
                  c.save();
                  if (shakeTimer > 0f) {
                      float sx = (rng.nextFloat() - 0.5f) * 2f * shakeMag;
                      float sy = (rng.nextFloat() - 0.5f) * 2f * shakeMag;
                      c.translate(sx, sy);
                  }

                  int biome = ((int) (distance / 450f)) % 3;
                  int shoulderColor = (biome == 0) ? Color.rgb(34, 52, 42) : (biome == 1 ? Color.rgb(24, 22, 44) : Color.rgb(52, 34, 28));
                  int roadColor = (biome == 1) ? Color.rgb(28, 30, 38) : Color.rgb(42, 44, 50);

                  fillPaint.setColor(shoulderColor);
                  c.drawRect(0, 0, width, height, fillPaint);

                  fillPaint.setColor(roadColor);
                  c.drawRect(roadLeft, 0, roadRight, height, fillPaint);

                  // Saffron & white highway kerbs
                  float kerbW = width * 0.022f;
                  float dashH = height * 0.08f;
                  for (float y = roadScroll - dashH * 2f; y < height + dashH; y += dashH) {
                      int idx = Math.round((y - roadScroll) / dashH);
                      fillPaint.setColor((idx % 2 == 0) ? Color.rgb(255, 130, 30) : Color.rgb(245, 245, 245));
                      c.drawRect(roadLeft - kerbW, y, roadLeft, y + dashH, fillPaint);
                      c.drawRect(roadRight, y, roadRight + kerbW, y + dashH, fillPaint);
                  }

                  // Lane dashes
                  fillPaint.setColor(Color.argb(175, 255, 240, 190));
                  float lineW = Math.max(4f, width * 0.008f);
                  float dashStep = height * 0.16f;
                  for (int i = 1; i < 4; i++) {
                      float lx = roadLeft + laneWidth * i - lineW * 0.5f;
                      for (float y = roadScroll - dashStep; y < height + dashStep; y += dashStep) {
                          c.drawRoundRect(lx, y, lx + lineW, y + dashStep * 0.48f, 4f, 4f, fillPaint);
                      }
                  }

                  drawScenery(c);

                  // Speed lines during Chai Nitro
                  if (nitroActive && state == STATE_PLAYING) {
                      strokePaint.setColor(Color.argb(120, 255, 210, 100));
                      strokePaint.setStrokeWidth(4f);
                      for (int i = 0; i < 8; i++) {
                          float sx = roadLeft + rng.nextFloat() * roadWidth;
                          float sy = rng.nextFloat() * height;
                          c.drawLine(sx, sy, sx, sy + 110f, strokePaint);
                      }
                  }

                  // Pickups
                  for (Pickup p : pickups) drawPickup(c, p);

                  // Obstacles
                  for (Obstacle o : obstacles) drawObstacle(c, o);

                  // Horn shockwave
                  if (hornWaveAlpha > 0f) {
                      strokePaint.setColor(Color.argb((int) (hornWaveAlpha * 230), 255, 230, 70));
                      strokePaint.setStrokeWidth(10f);
                      c.drawCircle(playerX, playerY, hornWaveRadius, strokePaint);
                  }

                  // Player
                  if (state != STATE_MENU) {
                      boolean blinkHide = (invulnTimer > 0f) && (((int) (invulnTimer * 16f)) % 2 == 0);
                      if (!blinkHide) drawPlayer(c, playerX, playerY, playerW, playerH, playerTilt, selectedRide);
                      if (hasShield) {
                          strokePaint.setColor(Color.argb(210, 80, 235, 255));
                          strokePaint.setStrokeWidth(7f);
                          c.drawCircle(playerX, playerY, Math.max(playerW, playerH) * 0.68f, strokePaint);
                      }
                  }

                  // Particles
                  for (Particle pt : particles) {
                      int a = (int) (255 * Math.max(0f, pt.life / pt.maxLife));
                      fillPaint.setColor(Color.argb(a, Color.red(pt.color), Color.green(pt.color), Color.blue(pt.color)));
                      c.drawCircle(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), fillPaint);
                  }

                  // Floating text
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(width * 0.044f);
                  for (FloatText ft : floatTexts) {
                      int a = (int) (255 * Math.min(1f, ft.life * 1.4f));
                      textPaint.setColor(Color.argb(a, 0, 0, 0));
                      c.drawText(ft.text, ft.x + 3, ft.y + 3, textPaint);
                      textPaint.setColor(Color.argb(a, Color.red(ft.color), Color.green(ft.color), Color.blue(ft.color)));
                      c.drawText(ft.text, ft.x, ft.y, textPaint);
                  }

                  c.restore();

                  if (state == STATE_PLAYING || state == STATE_PAUSED) {
                      drawHUD(c);
                  }
                  if (state == STATE_MENU) {
                      drawMenu(c);
                  } else if (state == STATE_PAUSED) {
                      drawPauseOverlay(c);
                  } else if (state == STATE_GAME_OVER) {
                      drawGameOver(c);
                  }
              }

              private void drawScenery(Canvas c) {
                  for (Scenery s : sceneries) {
                      float sx = s.leftSide ? roadLeft * 0.45f : roadRight + (width - roadRight) * 0.55f;
                      if (s.kind == 0) {
                          // Tree canopy
                          fillPaint.setColor(Color.rgb(28, 125, 58));
                          c.drawCircle(sx, s.y, width * 0.045f, fillPaint);
                          strokePaint.setColor(Color.rgb(12, 22, 16));
                          strokePaint.setStrokeWidth(4f);
                          c.drawCircle(sx, s.y, width * 0.045f, strokePaint);
                      } else if (s.kind == 1) {
                          // Streetlamp glow
                          fillPaint.setColor(Color.argb(70, 255, 200, 80));
                          c.drawCircle(sx, s.y, width * 0.055f, fillPaint);
                          fillPaint.setColor(Color.rgb(255, 225, 120));
                          c.drawCircle(sx, s.y, width * 0.018f, fillPaint);
                      } else {
                          // Roadside Dhaba neon board
                          float bw = width * 0.075f;
                          float bh = width * 0.042f;
                          fillPaint.setColor(Color.rgb(220, 45, 95));
                          c.drawRoundRect(sx - bw * 0.5f, s.y - bh * 0.5f, sx + bw * 0.5f, s.y + bh * 0.5f, 8f, 8f, fillPaint);
                          strokePaint.setColor(Color.rgb(255, 230, 90));
                          strokePaint.setStrokeWidth(3f);
                          c.drawRoundRect(sx - bw * 0.5f, s.y - bh * 0.5f, sx + bw * 0.5f, s.y + bh * 0.5f, 8f, 8f, strokePaint);
                      }
                  }
              }


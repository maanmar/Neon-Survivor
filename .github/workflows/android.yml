              private void finishRun() {
                  state = STATE_GAME_OVER;
                  if (score > bestScore) bestScore = score;
                  totalCoins += runCoins;
                  prefs.edit()
                      .putInt("best_score", bestScore)
                      .putInt("total_coins", totalCoins)
                      .apply();

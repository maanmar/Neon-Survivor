              private void drawObstacle(Canvas c, Obstacle o) {
                  float l = o.x - o.w * 0.5f;
                  float t = o.y - o.h * 0.5f;
                  float r = o.x + o.w * 0.5f;
                  float b = o.y + o.h * 0.5f;

                  if (o.type == OBS_CAR) {
                      fillPaint.setColor(o.color);
                      c.drawRoundRect(l, t, r, b, 18f, 18f, fillPaint);
                      fillPaint.setColor(Color.rgb(40, 55, 75));
                      c.drawRoundRect(l + o.w * 0.14f, t + o.h * 0.20f, r - o.w * 0.14f, b - o.h * 0.25f, 10f, 10f, fillPaint);
                      fillPaint.setColor(Color.rgb(255, 50, 50));
                      c.drawRect(l + 8, b - 10, l + o.w * 0.3f, b - 2, fillPaint);
                      c.drawRect(r - o.w * 0.3f, b - 10, r - 8, b - 2, fillPaint);
                  } else if (o.type == OBS_TRUCK) {
                      fillPaint.setColor(o.color);
                      c.drawRoundRect(l, t, r, b, 12f, 12f, fillPaint);
                      fillPaint.setColor(Color.rgb(255, 210, 40));
                      c.drawRect(l + 6, b - o.h * 0.18f, r - 6, b - 6, fillPaint);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setTextSize(o.w * 0.19f);
                      textPaint.setColor(Color.rgb(20, 20, 20));
                      c.drawText("HORN OK", o.x, b - o.h * 0.06f, textPaint);
                  } else if (o.type == OBS_BARRICADE) {
                      fillPaint.setColor(Color.rgb(245, 195, 25));
                      c.drawRoundRect(l, t, r, b, 8f, 8f, fillPaint);
                      fillPaint.setColor(Color.rgb(25, 25, 25));
                      for (int i = 0; i < 3; i++) {
                          float sx = l + o.w * (0.14f + i * 0.30f);
                          c.drawRect(sx, t + 4, sx + o.w * 0.12f, b - 4, fillPaint);
                      }
                  } else {
                      // Stray cow
                      fillPaint.setColor(Color.rgb(245, 240, 230));
                      c.drawRoundRect(l, t + o.h * 0.15f, r, b - o.h * 0.1f, 22f, 22f, fillPaint);
                      fillPaint.setColor(Color.rgb(120, 82, 52));
                      c.drawCircle(o.x - o.w * 0.18f, o.y, o.w * 0.16f, fillPaint);
                      c.drawCircle(o.x + o.w * 0.22f, o.y - o.h * 0.1f, o.w * 0.14f, fillPaint);
                      fillPaint.setColor(Color.rgb(235, 180, 170));
                      c.drawOval(o.x - o.w * 0.2f, b - o.h * 0.28f, o.x + o.w * 0.2f, b, fillPaint);
                  }

                  strokePaint.setColor(Color.rgb(15, 15, 18));
                  strokePaint.setStrokeWidth(4.5f);
                  c.drawRoundRect(l, t, r, b, 14f, 14f, strokePaint);
              }


      - name: Write GameView part 2
        run: |
          cat << 'EOF' >> app/src/main/java/com/maan/desiturbo/GameView.java
                  if (nitro < 30f) return;
                  nitroActive = true;
                  sound.playTurbo();
                  vibrate(60);
                  addFloatText("CHAI NITRO!", playerX, playerY - playerH * 0.8f, Color.rgb(255, 145, 40));
              }

              private void vibrate(int ms) {
                  if (vibrator == null) return;
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                      } else {
                          vibrator.vibrate(ms);
                      }
                  } catch (Throwable ignored) {}
              }

              private void addParticles(float x, float y, int color, int count, float speedScale) {
                  for (int i = 0; i < count; i++) {
                      Particle p = new Particle();
                      double ang = rng.nextDouble() * Math.PI * 2.0;
                      float spd = (120f + rng.nextFloat() * 340f) * speedScale;
                      p.x = x;
                      p.y = y;
                      p.vx = (float) Math.cos(ang) * spd;
                      p.vy = (float) Math.sin(ang) * spd;
                      p.size = 6f + rng.nextFloat() * 12f;
                      p.maxLife = 0.28f + rng.nextFloat() * 0.35f;
                      p.life = p.maxLife;
                      p.color = color;
                      particles.add(p);
                  }
              }

              private void addFloatText(String msg, float x, float y, int color) {
                  FloatText ft = new FloatText();
                  ft.text = msg;
                  ft.x = x;
                  ft.y = y;
                  ft.vy = -140f;
                  ft.life = 0.9f;
                  ft.color = color;
                  floatTexts.add(ft);
              }

              private void update(float dt) {
                  menuPulse += dt * 3.2f;
                  if (state == STATE_MENU) {
                      roadScroll = (roadScroll + 320f * dt) % (height * 0.16f);
                      updateScenery(320f, dt);
                      return;
                  }
                  if (state != STATE_PLAYING) return;

                  float speedRamp = Math.min(540f, distance * 0.085f);
                  float targetSpeed = baseSpeed + speedRamp;
                  if (nitroActive) {
                      targetSpeed *= 1.72f;
                      nitro -= dt * 24f;
                      if (nitro <= 0f) {
                          nitro = 0f;
                          nitroActive = false;
                      }
                      if (rng.nextFloat() < 0.7f) {
                          Particle f = new Particle();
                          f.x = playerX + (rng.nextFloat() - 0.5f) * playerW * 0.45f;
                          f.y = playerY + playerH * 0.52f;
                          f.vx = (rng.nextFloat() - 0.5f) * 60f;
                          f.vy = 320f + rng.nextFloat() * 200f;
                          f.size = 10f + rng.nextFloat() * 10f;
                          f.maxLife = 0.25f;
                          f.life = f.maxLife;
                          f.color = rng.nextBoolean() ? Color.rgb(255, 160, 20) : Color.rgb(255, 240, 90);
                          particles.add(f);
                      }
                  } else {
                      nitro = Math.min(100f, nitro + dt * 3.5f);
                  }

                  currentSpeed += (targetSpeed - currentSpeed) * Math.min(1f, dt * 6f);
                  float scaleSpeed = currentSpeed * (height / 1800f);
                  distance += (currentSpeed * dt) * 0.03f;
                  score += (int) ((currentSpeed * dt) * (nitroActive ? 0.055f : 0.03f));

                  roadScroll = (roadScroll + scaleSpeed * dt) % (height * 0.16f);
                  updateScenery(scaleSpeed, dt);

                  if (invulnTimer > 0f) invulnTimer = Math.max(0f, invulnTimer - dt);
                  if (hornCooldown > 0f) hornCooldown = Math.max(0f, hornCooldown - dt);
                  if (hornWaveAlpha > 0f) {
                      hornWaveRadius += width * 1.8f * dt;
                      hornWaveAlpha = Math.max(0f, hornWaveAlpha - dt * 2.1f);
                  }
                  if (shakeTimer > 0f) shakeTimer = Math.max(0f, shakeTimer - dt);

                  float targetX = laneCenter(playerLane);
                  float dx = targetX - playerX;
                  playerX += dx * Math.min(1f, dt * 15f);
                  playerTilt = Math.max(-14f, Math.min(14f, dx * 0.09f));

                  spawnTimer -= dt;
                  if (spawnTimer <= 0f) {
                      spawnObstacle();
                      float minGap = Math.max(0.42f, 1.08f - distance * 0.00028f);
                      spawnTimer = minGap + rng.nextFloat() * 0.42f;
                  }

                  pickupTimer -= dt;
                  if (pickupTimer <= 0f) {
                      spawnPickup();
                      pickupTimer = 0.75f + rng.nextFloat() * 0.65f;
                  }

                  Iterator<Obstacle> oIt = obstacles.iterator();
                  while (oIt.hasNext()) {
                      Obstacle o = oIt.next();
                      o.y += scaleSpeed * o.speedFactor * dt;
                      if (o.scared) o.x += o.vx * dt;

                      if (o.y - o.h > height + 100f || o.x < -width || o.x > width * 2f) {
                          oIt.remove();
                          continue;
                      }

                      if (!o.scared && checkOverlap(playerX, playerY, playerW * 0.78f, playerH * 0.78f, o.x, o.y, o.w * 0.82f, o.h * 0.82f)) {
                          boolean canSmash = nitroActive || (selectedRide == RIDE_TRACTOR && o.type == OBS_BARRICADE);
                          if (canSmash) {
                              oIt.remove();
                              score += 50;
                              sound.playSmash();
                              vibrate(50);
                              shakeTimer = 0.16f;
                              shakeMag = 14f;
                              addParticles(o.x, o.y, Color.rgb(255, 190, 60), 14, 1.1f);
                              addFloatText("+50 SMASH!", o.x, o.y, Color.rgb(255, 220, 80));
                          } else if (invulnTimer <= 0f) {
                              oIt.remove();
                              if (hasShield) {
                                  hasShield = false;
                                  invulnTimer = 1.2f;
                                  sound.playSmash();
                                  vibrate(65);
                                  addParticles(playerX, playerY, Color.rgb(80, 220, 255), 16, 1.0f);
                                  addFloatText("SHIELD SAVED!", playerX, playerY - playerH, Color.rgb(100, 235, 255));
                              } else {
                                  hp--;
                                  invulnTimer = 1.4f;
                                  shakeTimer = 0.30f;
                                  shakeMag = 24f;
                                  sound.playCrash();
                                  vibrate(140);
                                  addParticles(playerX, playerY, Color.rgb(255, 85, 55), 22, 1.3f);
                                  if (hp <= 0) {
                                      finishRun();
                                      return;
                                  }
                              }
                          }
                      }
                  }

                  Iterator<Pickup> pIt = pickups.iterator();
                  while (pIt.hasNext()) {
                      Pickup p = pIt.next();
                      p.y += scaleSpeed * 0.86f * dt;
                      p.phase += dt * 7f;
                      if (p.y - p.r > height + 80f) {
                          pIt.remove();
                          continue;
                      }
                      if (checkOverlap(playerX, playerY, playerW, playerH, p.x, p.y, p.r * 2f, p.r * 2f)) {
                          pIt.remove();
                          if (p.type == ITEM_COIN) {
                              int mult = (selectedRide == RIDE_BULLET) ? 2 : 1;
                              runCoins += mult;
                              score += 15 * mult;
                              sound.playCoin();
                              addParticles(p.x, p.y, Color.rgb(255, 215, 40), 8, 0.7f);
                              addFloatText("+" + (15 * mult), p.x, p.y, Color.rgb(255, 235, 90));
                          } else if (p.type == ITEM_CHAI) {
                              nitro = Math.min(100f, nitro + 42f);
                              score += 40;
                              sound.playPowerup();
                              vibrate(35);
                              addParticles(p.x, p.y, Color.rgb(255, 165, 50), 12, 0.9f);
                              addFloatText("CHAI +42%!", p.x, p.y, Color.rgb(255, 190, 80));
                          } else if (p.type == ITEM_SHIELD) {
                              hasShield = true;
                              score += 35;
                              sound.playPowerup();
                              vibrate(40);
                              addParticles(p.x, p.y, Color.rgb(70, 225, 255), 12, 0.9f);
                              addFloatText("SHIELD ON!", p.x, p.y, Color.rgb(90, 235, 255));
                          }
                      }
                  }

                  Iterator<Particle> ptIt = particles.iterator();
                  while (ptIt.hasNext()) {
                      Particle pt = ptIt.next();
                      pt.x += pt.vx * dt;
                      pt.y += pt.vy * dt;
                      pt.life -= dt;
                      if (pt.life <= 0f) ptIt.remove();
                  }

                  Iterator<FloatText> ftIt = floatTexts.iterator();
                  while (ftIt.hasNext()) {
                      FloatText ft = ftIt.next();
                      ft.y += ft.vy * dt;
                      ft.life -= dt;
                      if (ft.life <= 0f) ftIt.remove();
                  }
              }

              private void updateScenery(float speed, float dt) {
                  for (Scenery s : sceneries) {
                      s.y += speed * 0.9f * dt;
                      if (s.y > height + 120f) {
                          s.y = -120f;
                          s.kind = rng.nextInt(3);
                      }
                  }
              }

              private void spawnObstacle() {
                  int lane = rng.nextInt(4);
                  for (Obstacle existing : obstacles) {
                      if (existing.y < height * 0.24f && existing.lane == lane) return;
                  }
                  Obstacle o = new Obstacle();
                  o.lane = lane;
                  o.x = laneCenter(lane);
                  int roll = rng.nextInt(100);
                  if (roll < 38) {
                      o.type = OBS_CAR;
                      o.w = laneWidth * 0.60f;
                      o.h = laneWidth * 1.12f;
                      o.speedFactor = 0.58f + rng.nextFloat() * 0.14f;
                      int[] carColors = {Color.rgb(235, 75, 75), Color.rgb(65, 165, 245), Color.rgb(245, 245, 245), Color.rgb(180, 95, 235)};
                      o.color = carColors[rng.nextInt(carColors.length)];
                  } else if (roll < 64) {
                      o.type = OBS_TRUCK;
                      o.w = laneWidth * 0.74f;
                      o.h = laneWidth * 1.75f;
                      o.speedFactor = 0.45f;
                      o.color = rng.nextBoolean() ? Color.rgb(225, 90, 35) : Color.rgb(35, 150, 175);
                  } else if (roll < 84) {
                      o.type = OBS_BARRICADE;
                      o.w = laneWidth * 0.78f;
                      o.h = laneWidth * 0.44f;
                      o.speedFactor = 0.90f;
                      o.color = Color.rgb(245, 195, 30);
                  } else {
                      o.type = OBS_COW;
                      o.w = laneWidth * 0.66f;
                      o.h = laneWidth * 0.68f;
                      o.speedFactor = 0.78f;
                      o.color = Color.rgb(245, 240, 230);
                  }
                  o.y = -o.h;
                  obstacles.add(o);
              }

              private void spawnPickup() {
                  int lane = rng.nextInt(4);
                  int roll = rng.nextInt(100);
                  if (roll < 72) {
                      int chain = 3 + rng.nextInt(3);
                      for (int i = 0; i < chain; i++) {
                          Pickup p = new Pickup();
                          p.type = ITEM_COIN;
                          p.lane = lane;
                          p.x = laneCenter(lane);
                          p.y = -80f - i * (laneWidth * 0.62f);
                          p.r = laneWidth * 0.20f;
                          p.phase = i * 0.5f;
                          pickups.add(p);
                      }
                  } else {
                      Pickup p = new Pickup();
                      p.type = (roll < 90) ? ITEM_CHAI : ITEM_SHIELD;
                      p.lane = lane;
                      p.x = laneCenter(lane);
                      p.y = -90f;
                      p.r = laneWidth * 0.26f;
                      pickups.add(p);
                  }
              }


name: Build Desi Turbo Rickshaw APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create Android project structure and configs
        run: |
          mkdir -p app/src/main/java/com/maan/desiturbo
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DesiTurboRickshaw"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.maan.desiturbo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.maan.desiturbo"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Desi Turbo"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#16212E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#189644" android:pathData="M24,30h60v50h-60z"/>
              <path android:fillColor="#FFCD14" android:pathData="M26,48h56v30h-56z"/>
              <path android:fillColor="#87E1FF" android:pathData="M34,34h40v12h-40z"/>
              <path android:fillColor="#FFFA90" android:pathData="M48,22h12v10h-12z"/>
          </vector>
          EOF

      - name: Write MainActivity and SoundEngine
        run: |
          cat << 'EOF' > app/src/main/java/com/maan/desiturbo/MainActivity.java
          package com.maan.desiturbo;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private GameView gameView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  gameView = new GameView(this);
                  setContentView(gameView);
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      View decor = getWindow().getDecorView();
                      decor.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (gameView != null) gameView.resume();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (gameView != null) gameView.pause();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (gameView != null) gameView.release();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/maan/desiturbo/SoundEngine.java
          package com.maan.desiturbo;

          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioTrack;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class SoundEngine {
              private static final int SAMPLE_RATE = 22050;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private volatile boolean muted = false;

              public boolean isMuted() {
                  return muted;
              }

              public void toggleMute() {
                  muted = !muted;
              }

              public void playCoin() {
                  if (muted) return;
                  executor.execute(() -> playSweep(880, 1480, 110, 0.28, false));
              }

              public void playPowerup() {
                  if (muted) return;
                  executor.execute(() -> {
                      playSweep(520, 780, 90, 0.28, false);
                      playSweep(780, 1180, 120, 0.28, false);
                  });
              }

              public void playHorn() {
                  if (muted) return;
                  executor.execute(() -> {
                      playDualTone(415, 523, 130, 0.35);
                      try { Thread.sleep(55); } catch (InterruptedException ignored) {}
                      playDualTone(415, 523, 190, 0.35);
                  });
              }

              public void playTurbo() {
                  if (muted) return;
                  executor.execute(() -> playSweep(260, 920, 260, 0.32, false));
              }

              public void playSmash() {
                  if (muted) return;
                  executor.execute(() -> playSweep(220, 65, 160, 0.42, true));
              }

              public void playCrash() {
                  if (muted) return;
                  executor.execute(() -> playSweep(190, 42, 340, 0.48, true));
              }

              private void playSweep(double startHz, double endHz, int ms, double volume, boolean noise) {
                  int count = (SAMPLE_RATE * ms) / 1000;
                  short[] samples = new short[count];
                  double phase = 0;
                  long seed = System.nanoTime();
                  for (int i = 0; i < count; i++) {
                      double t = (double) i / count;
                      double freq = startHz + (endHz - startHz) * t;
                      phase += 2.0 * Math.PI * freq / SAMPLE_RATE;
                      double env = (1.0 - t) * (i < 120 ? (i / 120.0) : 1.0);
                      double wave = Math.sin(phase);
                      if (noise) {
                          seed = (seed * 1103515245L + 12345L) & 0x7fffffffL;
                          double n = ((seed / (double) 0x7fffffffL) * 2.0 - 1.0);
                          wave = wave * 0.45 + n * 0.55;
                      }
                      samples[i] = (short) (wave * env * volume * Short.MAX_VALUE);
                  }
                  writeTrack(samples);
              }

              private void playDualTone(double hz1, double hz2, int ms, double volume) {
                  int count = (SAMPLE_RATE * ms) / 1000;
                  short[] samples = new short[count];
                  for (int i = 0; i < count; i++) {
                      double t = (double) i / count;
                      double env = (1.0 - 0.35 * t) * (i < 100 ? (i / 100.0) : 1.0);
                      double s1 = Math.sin(2.0 * Math.PI * hz1 * i / SAMPLE_RATE);
                      double s2 = Math.sin(2.0 * Math.PI * hz2 * i / SAMPLE_RATE);
                      double sq = (s1 + s2) * 0.5;
                      sq = Math.max(-0.85, Math.min(0.85, sq * 1.4));
                      samples[i] = (short) (sq * env * volume * Short.MAX_VALUE);
                  }
                  writeTrack(samples);
              }

              private void writeTrack(short[] samples) {
                  AudioTrack track = null;
                  try {
                      int minBuf = AudioTrack.getMinBufferSize(
                          SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                      );
                      int bufBytes = Math.max(minBuf, samples.length * 2);
                      track = new AudioTrack.Builder()
                          .setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build())
                          .setAudioFormat(new AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(SAMPLE_RATE)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build())
                          .setBufferSizeInBytes(bufBytes)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build();
                      track.write(samples, 0, samples.length);
                      track.play();
                      Thread.sleep((samples.length * 1000L) / SAMPLE_RATE + 20);
                  } catch (Throwable ignored) {
                  } finally {
                      if (track != null) {
                          try { track.stop(); } catch (Throwable ignored) {}
                          try { track.release(); } catch (Throwable ignored) {}
                      }
                  }
              }

              public void release() {
                  executor.shutdownNow();
              }
          }
          EOF

      - name: Write GameView part 1
        run: |
          cat << 'EOF' > app/src/main/java/com/maan/desiturbo/GameView.java
          package com.maan.desiturbo;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          import android.view.SurfaceView;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Random;

          public class GameView extends SurfaceView implements SurfaceHolder.Callback, Runnable {
              private static final int STATE_MENU = 0;
              private static final int STATE_PLAYING = 1;
              private static final int STATE_PAUSED = 2;
              private static final int STATE_GAME_OVER = 3;

              private static final int RIDE_AUTO = 0;
              private static final int RIDE_TRACTOR = 1;
              private static final int RIDE_BULLET = 2;

              private static final int OBS_CAR = 0;
              private static final int OBS_TRUCK = 1;
              private static final int OBS_BARRICADE = 2;
              private static final int OBS_COW = 3;

              private static final int ITEM_COIN = 0;
              private static final int ITEM_CHAI = 1;
              private static final int ITEM_SHIELD = 2;

              private static class Obstacle {

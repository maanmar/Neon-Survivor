              private final RectF btnPlay = new RectF();
              private final RectF btnRide0 = new RectF();
              private final RectF btnRide1 = new RectF();
              private final RectF btnRide2 = new RectF();
              private final RectF btnHorn = new RectF();
              private final RectF btnNitro = new RectF();
              private final RectF btnPause = new RectF();
              private final RectF btnMute = new RectF();
              private final RectF btnRestart = new RectF();
              private final RectF btnMenu = new RectF();

              public GameView(Context context) {
                  super(context);
                  holder = getHolder();
                  holder.addCallback(this);
                  sound = new SoundEngine();
                  prefs = context.getSharedPreferences("desi_turbo_prefs", Context.MODE_PRIVATE);
                  vibrator = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);

                  bestScore = prefs.getInt("best_score", 0);
                  totalCoins = prefs.getInt("total_coins", 0);
                  selectedRide = prefs.getInt("selected_ride", RIDE_AUTO);

                  strokePaint.setStyle(Paint.Style.STROKE);
                  strokePaint.setStrokeJoin(Paint.Join.ROUND);
                  strokePaint.setStrokeCap(Paint.Cap.ROUND);
                  textPaint.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));

                  setFocusable(true);
              }

              private void computeLayout(int w, int h) {
                  width = Math.max(1, w);
                  height = Math.max(1, h);
                  roadWidth = width * 0.78f;
                  roadLeft = (width - roadWidth) * 0.5f;
                  roadRight = roadLeft + roadWidth;
                  laneWidth = roadWidth / 4f;

                  playerY = height * 0.76f;
                  updatePlayerDimensions();
                  playerX = laneCenter(playerLane);

                  float pad = width * 0.04f;
                  float topY = height * 0.045f;
                  float iconSz = width * 0.115f;
                  btnPause.set(width - pad - iconSz, topY, width - pad, topY + iconSz);
                  btnMute.set(btnPause.left - pad * 0.6f - iconSz, topY, btnPause.left - pad * 0.6f, topY + iconSz);

                  float ctrlR = width * 0.17f;
                  float ctrlY = height - height * 0.085f;
                  btnHorn.set(pad, ctrlY - ctrlR, pad + ctrlR * 1.9f, ctrlY + ctrlR * 0.25f);
                  btnNitro.set(width - pad - ctrlR * 1.9f, ctrlY - ctrlR, width - pad, ctrlY + ctrlR * 0.25f);

                  float cardW = (width - pad * 4f) / 3f;
                  float cardH = height * 0.17f;
                  float cardY = height * 0.50f;
                  btnRide0.set(pad, cardY, pad + cardW, cardY + cardH);
                  btnRide1.set(btnRide0.right + pad, cardY, btnRide0.right + pad + cardW, cardY + cardH);
                  btnRide2.set(btnRide1.right + pad, cardY, btnRide1.right + pad + cardW, cardY + cardH);

                  btnPlay.set(width * 0.14f, height * 0.73f, width * 0.86f, height * 0.82f);
                  btnRestart.set(width * 0.14f, height * 0.60f, width * 0.86f, height * 0.685f);
                  btnMenu.set(width * 0.22f, height * 0.71f, width * 0.78f, height * 0.78f);

                  if (sceneries.isEmpty()) {
                      for (int i = 0; i < 14; i++) {
                          Scenery s = new Scenery();
                          s.y = (height / 7f) * (i / 2f);
                          s.leftSide = (i % 2 == 0);
                          s.kind = rng.nextInt(3);
                          sceneries.add(s);
                      }
                  }
              }

              private void updatePlayerDimensions() {
                  if (selectedRide == RIDE_BULLET) {
                      playerW = laneWidth * 0.44f;
                      playerH = laneWidth * 0.96f;
                  } else if (selectedRide == RIDE_TRACTOR) {
                      playerW = laneWidth * 0.68f;
                      playerH = laneWidth * 1.18f;
                  } else {
                      playerW = laneWidth * 0.58f;
                      playerH = laneWidth * 1.08f;
                  }
              }

              private float laneCenter(int lane) {
                  return roadLeft + laneWidth * (lane + 0.5f);
              }

              private void startNewRun() {
                  obstacles.clear();
                  pickups.clear();
                  particles.clear();
                  floatTexts.clear();

                  updatePlayerDimensions();
                  playerLane = 1;
                  playerX = laneCenter(playerLane);
                  playerTilt = 0f;

                  if (selectedRide == RIDE_TRACTOR) {
                      maxHp = 4;
                      baseSpeed = 590f;
                  } else if (selectedRide == RIDE_BULLET) {
                      maxHp = 2;
                      baseSpeed = 720f;
                  } else {
                      maxHp = 3;
                      baseSpeed = 640f;
                  }
                  hp = maxHp;
                  invulnTimer = 0f;
                  hasShield = false;
                  nitro = 45f;
                  nitroActive = false;
                  hornCooldown = 0f;
                  hornWaveAlpha = 0f;
                  distance = 0f;
                  score = 0;
                  runCoins = 0;
                  spawnTimer = 0.6f;
                  pickupTimer = 0.4f;
                  shakeTimer = 0f;

                  state = STATE_PLAYING;
                  sound.playPowerup();
                  vibrate(35);
              }

              private void triggerHorn() {
                  if (hornCooldown > 0f) return;
                  hornCooldown = 4.0f;
                  hornWaveRadius = playerW * 0.5f;
                  hornWaveAlpha = 1f;
                  sound.playHorn();
                  vibrate(45);
                  addFloatText("HORN OK!", playerX, playerY - playerH * 0.7f, Color.rgb(255, 230, 80));

                  float blastRange = height * 0.44f;
                  for (Obstacle o : obstacles) {
                      float dy = playerY - o.y;
                      if (dy > -playerH * 0.5f && dy < blastRange && Math.abs(o.x - playerX) < laneWidth * 1.65f) {
                          if (o.type == OBS_COW || o.type == OBS_CAR) {
                              o.scared = true;
                              o.vx = (o.x < width * 0.5f) ? -width * 0.7f : width * 0.7f;
                              score += 25;
                              addFloatText("+25 CLEAR!", o.x, o.y, Color.rgb(120, 255, 190));
                          }
                      }
                  }
              }

